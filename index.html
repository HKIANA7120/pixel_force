<script>
(function(){
"use strict";
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const W = cv.width, H = cv.height;
const WORLD_W = 2400; 

let audioCtx;
function initAudio(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if(audioCtx.state === 'suspended') audioCtx.resume();
}
function playSnd(type){
  if(!audioCtx) return;
  const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  const now = audioCtx.currentTime;
  if(type==='shoot'){
    osc.type='square'; osc.frequency.setValueAtTime(400,now); osc.frequency.exponentialRampToValueAtTime(100,now+0.1);
    gain.gain.setValueAtTime(0.1,now); gain.gain.linearRampToValueAtTime(0,now+0.1);
    osc.start(now); osc.stop(now+0.1);
  } else if(type==='jump'){
    osc.type='sine'; osc.frequency.setValueAtTime(300,now); osc.frequency.linearRampToValueAtTime(600,now+0.15);
    gain.gain.setValueAtTime(0.1,now); gain.gain.linearRampToValueAtTime(0,now+0.15);
    osc.start(now); osc.stop(now+0.15);
  } else if(type==='dash'){
    osc.type='sawtooth'; osc.frequency.setValueAtTime(500,now); osc.frequency.exponentialRampToValueAtTime(100,now+0.2);
    gain.gain.setValueAtTime(0.15,now); gain.gain.linearRampToValueAtTime(0,now+0.2);
    osc.start(now); osc.stop(now+0.2);
  } else if(type==='coin'){
    osc.type='square'; osc.frequency.setValueAtTime(800,now); osc.frequency.setValueAtTime(1200,now+0.05);
    gain.gain.setValueAtTime(0.05,now); gain.gain.linearRampToValueAtTime(0,now+0.1);
    osc.start(now); osc.stop(now+0.1);
  } else if(type==='hit'){
    osc.type='sawtooth'; osc.frequency.setValueAtTime(200,now); osc.frequency.exponentialRampToValueAtTime(50,now+0.2);
    gain.gain.setValueAtTime(0.2,now); gain.gain.linearRampToValueAtTime(0,now+0.2);
    osc.start(now); osc.stop(now+0.2);
  } else if(type==='exp'){
    osc.type='square'; osc.frequency.setValueAtTime(100,now); osc.frequency.exponentialRampToValueAtTime(10,now+0.4);
    gain.gain.setValueAtTime(0.3,now); gain.gain.linearRampToValueAtTime(0,now+0.4);
    osc.start(now); osc.stop(now+0.4);
  }
}

let actionKeys = { left:'KeyA', right:'KeyD', jump:'KeyW', down:'KeyS', shoot:'Space', dash:'ShiftLeft', reload:'KeyR', shop:'KeyB', item:'KeyQ' };
const actionNames = { left:'이동 (좌)', right:'이동 (우)', jump:'점프 / 오르기', down:'내려가기', shoot:'사격', dash:'대시(회피)', reload:'재장전', shop:'상점 열기', item:'다이너마이트' };

const keys = {};
let typedBuffer = "";

window.addEventListener('keydown', e=>{
  initAudio();
  typedBuffer += e.key.toLowerCase();
  if (typedBuffer.length > 10) typedBuffer = typedBuffer.slice(-10);
  if (typedBuffer.includes("mnmn")) {
    globalCoins += 99999;
    saveGlobal();
    spawnText(W/2, H/2, "EASTER EGG UNLOCKED: +99,999 GOLD!", "#00ff00", 2.0, 3.0);
    playSnd('coin');
    typedBuffer = "";
  }

  if(gameState === 'settings' && waitingForKey){
    const act = Object.keys(actionKeys)[settingsCursor];
    actionKeys[act] = e.code; waitingForKey = false; e.preventDefault(); return;
  }
  keys[e.code] = true;
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e=>{ keys[e.code] = false; });

let camera = { x: 0, y: 0 };
let spacePressedLast = false; let bPressedLast = false; let sPressedLast = false; let lPressedLast = false; let qPressedLast = false;
let pPressedLast = false; let escPressedLast = false; let ePressedLast = false; let oPressedLast = false;
let keyLeftLast = false; let keyRightLast = false; let keyUpLast = false; let keyDownLast = false; let jumpPressedLast = false;

let gameState = 'title'; 
let difficultyMode = 'normal'; 
let isPractice = false;

function rand(a,b){ return a + Math.random()*(b-a); }
function rint(a,b){ return Math.floor(rand(a,b+1)); }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function aabb(a,b){ return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y; }

let globalCoins = parseInt(localStorage.getItem('pf_coins')||'0');
let savedUnlocked = JSON.parse(localStorage.getItem('pf_unlocked_v3')||'null');
let unlockedItems = new Array(25).fill(false);
unlockedItems[0] = true; unlockedItems[8] = true; 

if(savedUnlocked){ 
    for(let i=0;i<Math.min(savedUnlocked.length,25);i++) unlockedItems[i] = savedUnlocked[i]; 
} else {
    let oldUnlocked = JSON.parse(localStorage.getItem('pf_unlocked_v2')||'null');
    if (oldUnlocked) {
        for(let i=0;i<Math.min(oldUnlocked.length,12);i++) unlockedItems[i] = oldUnlocked[i];
    }
}

let globalUpgrades = JSON.parse(localStorage.getItem('pf_upgrades')||'{"hp":0, "armor":0, "dmg":0}');

let equippedGun = parseInt(localStorage.getItem('pf_equip_v3')||'0');
let equippedSkin = parseInt(localStorage.getItem('pf_skin_v3')||'0');
let earnedCoinsThisRun = 0;

let combo = 0; let comboTimer = 0; 
let nightmareTimer = 30.0;

function saveGlobal() {
  localStorage.setItem('pf_coins', globalCoins);
  localStorage.setItem('pf_unlocked_v3', JSON.stringify(unlockedItems));
  localStorage.setItem('pf_equip_v3', equippedGun);
  localStorage.setItem('pf_skin_v3', equippedSkin);
  localStorage.setItem('pf_upgrades', JSON.stringify(globalUpgrades));
}
function addCombo() { combo++; comboTimer = 3.5; }

let floatingTexts = [];
function spawnText(x, y, text, color, scale = 1.0, life = 1.0) {
    floatingTexts.push({ x, y, text, color, scale, life, maxLife: life, vy: -40 });
}
function updateFloatingTexts(dt) {
    for (let i = floatingTexts.length - 1; i >= 0; i--) {
        let ft = floatingTexts[i]; ft.life -= dt; ft.y += ft.vy * dt;
        if (ft.life <= 0) floatingTexts.splice(i, 1);
    }
}
function drawFloatingTexts() {
    for (const ft of floatingTexts) {
        ctx.save(); ctx.globalAlpha = clamp(ft.life / (ft.maxLife*0.5), 0, 1);
        ctx.fillStyle = ft.color; ctx.font = `bold ${Math.floor(14 * ft.scale)}px monospace`;
        ctx.textAlign = 'center'; ctx.lineWidth = 3; ctx.strokeStyle = '#000';
        ctx.strokeText(ft.text, ft.x, ft.y); ctx.fillText(ft.text, ft.x, ft.y); ctx.restore();
    }
}

let particles = [];
function spawnParticles(x,y,count,colors,speed,life,size){
  for(let i=0;i<count;i++){
    const a = rand(0,Math.PI*2); const sp = rand(speed*0.3,speed);
    particles.push({ x,y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - rand(0,speed*0.4), life: rand(life*0.6,life), maxLife: life, color: colors[rint(0,colors.length-1)], size: rand(size*0.6,size) });
  }
}
function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i]; p.vy += 600*dt; p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt;
    if(p.life<=0) particles.splice(i,1);
  }
}
function drawParticles(){
  for(const p of particles){
    ctx.globalAlpha = clamp(p.life/p.maxLife,0,1); ctx.fillStyle = p.color;
    ctx.fillRect(Math.round(p.x-p.size/2), Math.round(p.y-p.size/2), p.size, p.size);
  }
  ctx.globalAlpha = 1;
}
let shake = 0; 
function addShake(v){ shake = Math.min(shake+(v*0.5), 15); }

const GROUND_Y = H-70;
const STAGES = [
  { name:'DESERT CANYON', platformStyleKey:'wood', platforms:[{x:0, y:GROUND_Y, w:WORLD_W, h:70},{x:100, y:GROUND_Y-120, w:180, h:20}, {x:250, y:GROUND_Y-250, w:220, h:20},{x:580, y:GROUND_Y-160, w:160, h:20}, {x:780, y:GROUND_Y-320, w:280, h:20},{x:1150, y:GROUND_Y-150, w:200, h:20}, {x:1450, y:GROUND_Y-260, w:200, h:20},{x:1800, y:GROUND_Y-200, w:250, h:20}, {x:1950, y:GROUND_Y-340, w:200, h:20}], ropes:[{x:300, y:GROUND_Y-250, h:250}, {x:900, y:GROUND_Y-320, h:320}, {x:1550, y:GROUND_Y-260, h:260}, {x:2050, y:GROUND_Y-340, h:140}], drawBG(b){ const grad = b.createLinearGradient(0,0,0,H); grad.addColorStop(0,'#ff9a52'); grad.addColorStop(0.75,'#e8935a'); grad.addColorStop(1,'#c97448'); b.fillStyle = grad; b.fillRect(0,0,WORLD_W,H); b.fillStyle = '#fff4c2'; b.beginPath(); b.arc(150,110,55,0,Math.PI*2); b.fill(); } },
  { name:'GHOST TOWN', platformStyleKey:'dusty', platforms:[{x:0, y:GROUND_Y, w:WORLD_W, h:70},{x:60, y:GROUND_Y-140, w:160, h:20}, {x:280, y:GROUND_Y-280, w:200, h:20},{x:500, y:GROUND_Y-100, w:150, h:20}, {x:750, y:GROUND_Y-240, w:240, h:20},{x:1150, y:GROUND_Y-180, w:160, h:20}, {x:1400, y:GROUND_Y-300, w:220, h:20},{x:1750, y:GROUND_Y-160, w:180, h:20}], ropes:[{x:120, y:GROUND_Y-140, h:140}, {x:360, y:GROUND_Y-280, h:280},{x:850, y:GROUND_Y-240, h:240}, {x:1480, y:GROUND_Y-300, h:300}], drawBG(b){ const grad = b.createLinearGradient(0,0,0,H); grad.addColorStop(0,'#3a2350'); grad.addColorStop(0.5,'#8a4a5c'); grad.addColorStop(1,'#7a4030'); b.fillStyle = grad; b.fillRect(0,0,WORLD_W,H); b.fillStyle = '#ffcf8a'; b.beginPath(); b.arc(1800,140,46,0,Math.PI*2); b.fill(); } },
  { name:'BOX CANYON NIGHT', platformStyleKey:'stone', platforms:[{x:0, y:GROUND_Y, w:WORLD_W, h:70},{x:150, y:GROUND_Y-180, w:180, h:20}, {x:400, y:GROUND_Y-340, w:220, h:20},{x:750, y:GROUND_Y-140, w:200, h:20}, {x:1000, y:GROUND_Y-280, w:180, h:20},{x:1350, y:GROUND_Y-180, w:200, h:20}, {x:1650, y:GROUND_Y-320, w:240, h:20},{x:2050, y:GROUND_Y-200, w:160, h:20}], ropes:[{x:220, y:GROUND_Y-180, h:180}, {x:480, y:GROUND_Y-340, h:340},{x:1080, y:GROUND_Y-280, h:280}, {x:1750, y:GROUND_Y-320, h:320}], drawBG(b){ const grad = b.createLinearGradient(0,0,0,H); grad.addColorStop(0,'#050818'); grad.addColorStop(0.6,'#181034'); grad.addColorStop(1,'#241018'); b.fillStyle = grad; b.fillRect(0,0,WORLD_W,H); b.fillStyle = '#fff8e0'; for(let i=0;i<200;i++) b.fillRect(rand(0,WORLD_W),rand(0,H*0.6), rand(1,2), rand(1,2)); } }
];
const GRAVEYARD_STAGE = {
  name:'NIGHTMARE GRAVEYARD', platformStyleKey:'tomb', 
  platforms:[{x:0, y:GROUND_Y, w:WORLD_W, h:70},{x:120, y:GROUND_Y-130, w:180, h:20}, {x:320, y:GROUND_Y-270, w:180, h:20},{x:600, y:GROUND_Y-150, w:150, h:20}, {x:850, y:GROUND_Y-300, w:220, h:20},{x:1200, y:GROUND_Y-180, w:200, h:20}, {x:1500, y:GROUND_Y-280, w:200, h:20},{x:1850, y:GROUND_Y-160, w:180, h:20}], 
  ropes:[{x:250, y:GROUND_Y-270, h:270}, {x:700, y:GROUND_Y-300, h:300},{x:1350, y:GROUND_Y-280, h:280}, {x:1700, y:GROUND_Y-160, h:160}], 
  drawBG(b){ 
    const grad = b.createLinearGradient(0,0,0,H); 
    grad.addColorStop(0,'#040814'); grad.addColorStop(0.6,'#0a1828'); grad.addColorStop(1,'#142424'); 
    b.fillStyle = grad; b.fillRect(0,0,WORLD_W,H); 
    b.fillStyle = '#3a4a4a'; b.beginPath(); b.arc(200,120,75,0,Math.PI*2); b.fill(); 
    for(let i=0; i<45; i++) { 
      b.fillStyle='#0f1616';
      b.fillRect(rand(0,WORLD_W), GROUND_Y-rand(25,50), rand(18,28), 50);
    }
  } 
};
const HELL_STAGE = {
  name:'INFERNO ABYSS (HELL)', platformStyleKey:'hell_stone', 
  platforms:[{x:0, y:GROUND_Y, w:WORLD_W, h:70},{x:150, y:GROUND_Y-140, w:180, h:20}, {x:400, y:GROUND_Y-300, w:220, h:20},{x:750, y:GROUND_Y-160, w:200, h:20}, {x:1050, y:GROUND_Y-320, w:240, h:20},{x:1450, y:GROUND_Y-200, w:180, h:20}, {x:1750, y:GROUND_Y-340, w:200, h:20},{x:2100, y:GROUND_Y-220, w:160, h:20}], 
  ropes:[{x:240, y:GROUND_Y-140, h:140}, {x:500, y:GROUND_Y-300, h:300},{x:1150, y:GROUND_Y-320, h:320}, {x:1850, y:GROUND_Y-340, h:340}], 
  drawBG(b){ 
    const grad = b.createLinearGradient(0,0,0,H); 
    grad.addColorStop(0,'#110000'); grad.addColorStop(0.5,'#3a0505'); grad.addColorStop(1,'#8a1100'); 
    b.fillStyle = grad; b.fillRect(0,0,WORLD_W,H); 
    b.fillStyle = '#ff3300'; b.beginPath(); b.arc(WORLD_W-300, 150, 90, 0, Math.PI*2); b.fill();
    b.fillStyle = '#ffff00'; b.beginPath(); b.arc(WORLD_W-300, 150, 75, 0, Math.PI*2); b.fill();
    for(let i=0; i<80; i++) { 
      b.fillStyle= (i%2===0)?'#220000':'#440000';
      b.fillRect(rand(0,WORLD_W), GROUND_Y-rand(20,150), rand(30,60), 150);
    }
  } 
};
const PRACTICE_STAGE = {
  name: 'TRAINING ROOM', platformStyleKey: 'wood',
  platforms: [{x:0, y:GROUND_Y, w:WORLD_W, h:70}],
  ropes: [],
  drawBG(b) {
    b.fillStyle = '#1e1e1e'; b.fillRect(0,0,WORLD_W,H);
    b.fillStyle = '#2a2a2a'; for(let i=0; i<WORLD_W; i+=100) b.fillRect(i,0,2,H);
  }
};

let platforms = []; let ropes = []; let currentStageIndex = 0; let banner = {text:'', timer:0};
const bgCanvas = document.createElement('canvas'); bgCanvas.width = WORLD_W; bgCanvas.height = H;

function applyStage(idx){
  currentStageIndex = idx; 
  let st;
  if (idx === -1) st = PRACTICE_STAGE;
  else st = difficultyMode === 'hell' ? HELL_STAGE : (difficultyMode === 'nightmare' ? GRAVEYARD_STAGE : STAGES[idx]);
  
  const style = PLATFORM_STYLES[st.platformStyleKey] || PLATFORM_STYLES.wood;
  platforms = st.platforms.map(p=>({x:p.x,y:p.y,w:p.w,h:p.h,style}));
  ropes = st.ropes.map(r=>({x:r.x, y:r.y, h:r.h}));
  st.drawBG(bgCanvas.getContext('2d'));
  props = [];
  
  if (idx !== -1) {
      for(let i=0; i<18; i++){
        let p = platforms[rint(1, platforms.length-1)]; 
        props.push({ x:rand(p.x+10, p.x+p.w-30), y:p.y-24, w:24, h:24, hp:40, maxHp:40, dead:false });
      }
      banner = {text:'STAGE '+(idx+1)+' : '+st.name, timer:2.6};
  } else {
      banner = {text:'PRACTICE ROOM', timer:2.6};
  }
  
  enemies = []; bullets = []; dynamites = []; particles = []; items = []; floatingTexts = []; waveEnemiesToSpawn = 0;
  
  if (idx === -1) {
      for(let i=1; i<=6; i++) {
          enemies.push({ type: 'dummy', x: 200 + i*150, y: GROUND_Y-1, vx: 0, vy: 0, hp: 999999, maxHp: 999999, alive: true, walkPhase: 0, onGround: true, scale: 1.5, dmgBase: 0 });
      }
  }

  if(player){ player.x = 200; player.y = GROUND_Y-1; player.vx=0; player.vy=0; player.invuln = 1.0; player.climbing=false; player.jumpCount=0; player.frenzyTimer = 0; }
}

const PLATFORM_STYLES = {
  wood:  {top:'#8a5a34', body:'#6b4326', line:'#4a2e1a', rope:'#cda365'},
  dusty: {top:'#a67a52', body:'#7a5636', line:'#5c3d22', rope:'#988'},
  stone: {top:'#6a6660', body:'#3f3c36', line:'#232019', rope:'#3e6b3a'},
  tomb:  {top:'#304040', body:'#202828', line:'#101818', rope:'#506060'},
  hell_stone: {top:'#ff3300', body:'#330000', line:'#1a0000', rope:'#ff8800'}
};

function drawPlatformsAndRopes(){
  let rColor = '#cda365';
  if(STAGES[currentStageIndex]?.platformStyleKey === 'stone') rColor = '#4a7c4a';
  if(difficultyMode === 'nightmare') rColor = '#506060';
  if(difficultyMode === 'hell') rColor = '#ff8800';
  ctx.strokeStyle = rColor; ctx.lineWidth = 4;
  for(const r of ropes){
    ctx.beginPath(); ctx.moveTo(r.x, r.y); ctx.lineTo(r.x, r.y+r.h); ctx.stroke();
    for(let sy=r.y; sy<r.y+r.h; sy+=12) { ctx.beginPath(); ctx.moveTo(r.x-6, sy); ctx.lineTo(r.x+6, sy); ctx.stroke(); }
  }
  for(const p of platforms){
    const st = p.style;
    ctx.fillStyle = st.body; ctx.fillRect(p.x, p.y, p.w, p.h);
    ctx.fillStyle = st.top; ctx.fillRect(p.x, p.y, p.w, 5);
    ctx.fillStyle = st.line; for(let i=0;i<p.w;i+=22) ctx.fillRect(p.x+i, p.y+5, 3, p.h-5);
    ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(p.x, p.y+p.h-4, p.w, 4);
  }
}

let props = []; let items = []; let dynamites = [];

function damageProp(prop, dmg){
  prop.hp -= dmg; playSnd('hit');
  spawnParticles(prop.x+12, prop.y+12, 5, ['#8a5a34','#6b4326','#c9a227'], 150, 0.4, 4);
  spawnText(prop.x+12, prop.y-10, `${dmg}`, '#fff', 0.8, 0.5);
  if(prop.hp <= 0 && !prop.dead){
    prop.dead = true; addShake(4); playSnd('exp');
    spawnParticles(prop.x+12, prop.y+12, 20, ['#8a5a34','#6b4326','#4a2e1a'], 250, 0.6, 5);
    if (!isPractice && difficultyMode !== 'classic') {
        let coinCount = rint(1,3); for(let i=0; i<coinCount; i++) spawnCoin(prop.x+12, prop.y);
    } else if (difficultyMode === 'classic') {
        let coinCount = rint(2,5); for(let i=0; i<coinCount; i++) spawnCoin(prop.x+12, prop.y);
    }
  }
}
function spawnCoin(x,y, amount=1){ 
  for(let i=0; i<amount; i++) items.push({ type:'gold', x:x, y:y, vx:rand(-150,150), vy:rand(-300,-150), w:10, h:10, life:10, onGround:false }); 
}

function updateItems(dt){
  for(let i=items.length-1; i>=0; i--){
    let it = items[i]; it.life -= dt; if(it.life<=0){ items.splice(i,1); continue; }
    it.vy += 1200 * dt; it.x += it.vx * dt; it.y += it.vy * dt;
    if(it.y > GROUND_Y-it.h){ it.y = GROUND_Y-it.h; it.vy *= -0.5; it.vx *= 0.8; it.onGround=true; }
    for(const p of platforms){
      if(it.vy>0 && it.x+it.w>p.x && it.x<p.x+p.w && it.y+it.h>=p.y && it.y+it.h-it.vy*dt<=p.y+2){
        it.y = p.y - it.h; it.vy *= -0.5; it.vx *= 0.8; it.onGround=true;
      }
    }
    if(player.alive && aabb(it, {x:player.x-10, y:player.y-38, w:20, h:38})){
      if(it.type === 'gold'){
        let goldGain = 10;
        if (player.classId === 0) goldGain = Math.floor(goldGain * 1.15);
        gold += goldGain; 
        spawnParticles(it.x+5, it.y+5, 4, ['#ffff00','#ffcf6a'], 80, 0.3, 3); playSnd('coin');
      }
      else if(it.type === 'heal'){
        player.hp = Math.min(player.maxHp, player.hp + 30);
        spawnParticles(it.x+5, it.y+5, 12, ['#ff0000','#ffffff'], 120, 0.5, 4); playSnd('coin');
        spawnText(player.x, player.y - 40, "+30 HP", "#0f0", 1.2, 1);
      }
      else if(it.type === 'cursed_gem'){
        player.frenzyTimer = 5.0; 
        spawnParticles(it.x+6, it.y+6, 25, ['#aa00ff','#ff00ff','#ffffff'], 250, 0.7, 4); playSnd('exp');
        spawnText(player.x, player.y - 40, "CURSED FRENZY!", "#ff00ff", 1.2, 1.5);
        addShake(8);
      }
      items.splice(i,1);
    }
  }
}

function drawProps(){
  for(let i=props.length-1; i>=0; i--){
    let p = props[i]; if(p.dead){ props.splice(i,1); continue; }

function spawnDynamite(x,y,vx,vy, from='player', customDmg=0, type='dynamite'){ 
    dynamites.push({x,y,vx,vy, life: type==='meteor'?5.0:1.5, from, customDmg, type}); 
}

function updateDynamites(dt){
  for(let i=dynamites.length-1; i>=0; i--){
    let d = dynamites[i]; d.life -= dt; 
    
    if(d.type === 'meteor'){
        d.vy += 1500 * 0.2 * dt;
        d.x += d.vx*dt; d.y += d.vy*dt;
        spawnParticles(d.x, d.y, 1, ['#ff3a00','#ffaa00'], 60, 0.3, 3);
        
        if (d.y > GROUND_Y) { 
            explodeDynamite(d.x, GROUND_Y, d.from, d.customDmg); 
            dynamites.splice(i,1); continue;
        }
        for(const p of platforms){
          if(d.vy>0 && d.x>p.x && d.x<p.x+p.w && d.y>=p.y && d.y-d.vy*dt<=p.y+4){ 
             explodeDynamite(d.x, p.y, d.from, d.customDmg);
             d.life = -1; break;
          }
        }
        if(d.life<=0){ dynamites.splice(i,1); }
    } else {
        d.vy += GRAVITY*dt; d.x += d.vx*dt; d.y += d.vy*dt;
        if(d.y > GROUND_Y-5) { d.y=GROUND_Y-5; d.vy*=-0.5; d.vx*=0.7; }
        for(const p of platforms){
          if(d.vy>0 && d.x>p.x && d.x<p.x+p.w && d.y>=p.y && d.y-d.vy*dt<=p.y+2){ d.y = p.y-5; d.vy*=-0.5; d.vx*=0.7; }
        }
        if(d.life<=0){ explodeDynamite(d.x, d.y, d.from, d.customDmg); dynamites.splice(i,1); }
    }
  }
}
function drawDynamites(){
  for(const d of dynamites){
    if (d.type === 'meteor') {
        ctx.fillStyle='#ff5500'; ctx.beginPath(); ctx.arc(d.x, d.y, 8, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle='#ffeeaa'; ctx.beginPath(); ctx.arc(d.x, d.y, 4, 0, Math.PI*2); ctx.fill();
    } else {
        ctx.fillStyle='#f00'; ctx.fillRect(d.x-3, d.y-8, 6, 12);
        ctx.fillStyle='#fff'; ctx.fillRect(d.x-1, d.y-10, 2, 2);
        if(Math.floor(d.life*15)%2===0){ ctx.fillStyle='#ff0'; ctx.fillRect(d.x-2, d.y-12, 4, 4); }
    }
  }
}
function explodeDynamite(x,y, from, customDmg=0){
  playSnd('exp'); addShake(15);
  spawnParticles(x,y,60,['#ff0000','#ffaa00','#ffff00','#ffffff'], 450, 1.0, 5);
  
  if(from === 'player' || from === 'player_plasma' || from === 'player_doom' || from === 'enemy_bomber'){
    let dmg = (from === 'player' || from === 'player_plasma' || from === 'player_doom') ? (250 + shopStats.dmg.val) : (customDmg || 100);
    if(from === 'player_doom') dmg = Math.floor(dmg * 2.5);
    let radius = (from === 'player_doom') ? 220 : 140;

    for(const en of enemies){
      if(!en.alive) continue;
      if(Math.hypot(en.x-x, en.y-y) < radius) {
        damageEnemy(en, dmg, en.x, en.y, en.x>x?250:-250, 'player');
      }
    }
  } 
  
  if(from !== 'player' && from !== 'player_plasma' && from !== 'player_doom'){
    if(player.alive && Math.hypot(player.x-x, player.y-19-y) < 120){
      let dmgBase = customDmg || (40 * (1 + waveNum*0.1)); 
      if (waveNum >= 15 && !isPractice) dmgBase *= 2.0;
      damagePlayer(dmgBase); 
    }
  }
  
  for(const p of props){
    if(!p.dead && Math.hypot((p.x+12)-x, (p.y+12)-y) < 120) damageProp(p, 200);
  }
}

const SPRITE_PX = 2; const ANCHOR_COL = 8; const OUTLINE_COLOR = '#150b06';
function makeGrid(w,h){ return Array.from({length:h}, ()=>new Array(w).fill('.')); }
function seg(grid,row,start,len,ch){ for(let i=0;i<len;i++) grid[row][start+i]=ch; }
const UPPER_GRID = (function(){
  const g = makeGrid(16,13); seg(g,0,3,10,'H'); seg(g,1,3,10,'H'); seg(g,2,5,6,'h'); seg(g,3,5,6,'h'); seg(g,4,5,6,'b');
  seg(g,5,5,6,'f'); seg(g,6,5,6,'f'); seg(g,6,8,2,'e'); seg(g,7,5,6,'f'); seg(g,7,6,4,'F'); seg(g,8,4,8,'n'); 
  seg(g,9,3,2,'v'); seg(g,9,5,6,'s'); seg(g,9,11,2,'v'); seg(g,9,13,1,'a'); seg(g,9,14,2,'g');
  seg(g,10,3,2,'v'); seg(g,10,5,6,'s'); seg(g,10,11,2,'v'); seg(g,11,3,2,'v'); seg(g,11,5,6,'s'); seg(g,11,11,2,'v');
  seg(g,12,3,10,'k'); seg(g,12,7,2,'u'); return g;
})();
function buildLegGrid(lStart, rStart, lbStart, rbStart){
  const g = makeGrid(16,9); for(let r=0;r<6;r++){ seg(g,r,lStart,3,'p'); seg(g,r,rStart,3,'p'); }
  for(let r=6;r<9;r++){ seg(g,r,lbStart,5,'o'); seg(g,r,rbStart,5,'o'); } return g;
}
const LEG_IDLE = buildLegGrid(5,9,4,9), LEG_WALK_A = buildLegGrid(3,11,2,10), LEG_WALK_B = buildLegGrid(6,8,5,7), LEG_CLIMB = buildLegGrid(4,10,3,9);

function drawGridOutlined(grid, palette, leftX, topY, px){
  const rows = grid.length, cols = grid[0].length; ctx.fillStyle = OUTLINE_COLOR;
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      if(grid[r][c]==='.') continue; const neighbors = [[r-1,c],[r+1,c],[r,c-1],[r,c+1]];
      for(const [nr,nc] of neighbors){ if(nr<0||nr>=rows||nc<0||nc>=cols||grid[nr][nc]==='.') ctx.fillRect(leftX+nc*px, topY+nr*px, px, px); }
    }
  }
  for(let r=0;r<rows;r++){ for(let c=0;c<cols;c++){ if(grid[r][c]!=='.' && palette[grid[r][c]]){ ctx.fillStyle = palette[grid[r][c]]; ctx.fillRect(leftX+c*px, topY+r*px, px, px); } } }
}

function drawFigure(x, y, facing, walkPhase, palette, aiming, airborne, scaleFactor = 1, isClimbing = false){
  const px = SPRITE_PX; let legGrid = LEG_IDLE;
  if(isClimbing) { legGrid = (Math.floor(walkPhase)%2===0) ? LEG_WALK_A : LEG_WALK_B; } 
  else if(!airborne){ const s = Math.sin(walkPhase); if(s > 0.15) legGrid = LEG_WALK_A; else if(s < -0.15) legGrid = LEG_WALK_B; }
  const totalH = UPPER_GRID.length + legGrid.length;
  const leftX = -ANCHOR_COL*px, topUpper = -totalH*px, topLegs = topUpper + UPPER_GRID.length*px;

  ctx.save(); ctx.translate(Math.round(x), Math.round(y)); ctx.scale(facing * scaleFactor, scaleFactor);
  ctx.fillStyle='rgba(0,0,0,0.35)'; ctx.beginPath(); ctx.ellipse(0,1,10,3,0,0,Math.PI*2); ctx.fill();
  
  if (palette === SKIN_PHANT) { ctx.globalAlpha = 0.6; }

  drawGridOutlined(legGrid, palette, leftX, topLegs, px); drawGridOutlined(UPPER_GRID, palette, leftX, topUpper, px);

  if(aiming && !isClimbing){
    ctx.fillStyle='rgba(255,230,140,0.95)'; ctx.fillRect(leftX+16*px, topUpper+9*px-1, 5, px+1);
    ctx.fillStyle='rgba(255,180,90,0.6)'; ctx.fillRect(leftX+16*px+3, topUpper+9*px-2, 4, px+4);
  }
  ctx.restore();
}

  facing:1, hp:100, maxHp:100, ammo:10, maxAmmo:10, reloading:false, reloadTime:1.1, reloadTimer:0,
  shootCd:0, shootCdMax:0.22, dynaCd:0, dashCd:0, isDashing:false, dashTime:0, 
  walkPhase:0, invuln:0, alive:true, speed: 250, classId: 0, dmgTakenMult: 1.0, frenzyTimer: 0

function playerRect(){ return {x:player.x-7, y:player.y-38, w:14, h:38}; }

function applyClassStats() {
  player.classId = equippedSkin; player.dmgTakenMult = 1.0;
  let baseSpd = shopStats.speed.val; let baseHp = shopStats.maxHp.val;

  if (player.classId === 1) { baseSpd *= 1.2; player.dmgTakenMult = 1.2; } 
  else if (player.classId === 2) { baseHp += 50; player.dmgTakenMult = 0.8; baseSpd *= 0.9; }
  else if (player.classId === 3) { baseHp -= 20; player.dmgTakenMult = 1.1; baseSpd *= 1.05; }
  else if (player.classId === 4) { baseSpd *= 1.4; player.dmgTakenMult = 1.1; } 
  else if (player.classId === 5) { baseHp += 150; baseSpd *= 0.7; player.dmgTakenMult = 0.85; } 
  else if (player.classId === 6) { baseHp -= 30; } 
  
  player.speed = baseSpd; player.maxHp = baseHp;
}

function syncStats(){ 
  player.maxAmmo = shopStats.ammo.val; player.reloadTime = shopStats.reload.val; 
  applyClassStats();
  
  if(player.classId === 7) player.reloadTime *= 0.7; 

  let t = equippedGun;
  if (t === 0) player.shootCdMax = 0.22; 
  else if (t === 1) player.shootCdMax = 0.22; 
  else if (t === 2) player.shootCdMax = 0.4; 
  else if (t === 3) player.shootCdMax = 0.12; 
  else if (t === 4) player.shootCdMax = 0.6; 
  else if (t === 5) player.shootCdMax = 0.35; 
  else if (t === 12) player.shootCdMax = 0.8; 
  else if (t === 13) player.shootCdMax = 0.6; 

  if(player.classId === 7) player.shootCdMax *= 0.85; 
}

function resetPlayer(){

let bullets = [];
function spawnBullet(x,y,vx,vy,from, life=1.5, dmg=0, type='normal'){ 
  let isCrit = false;
  if(from === 'player') isCrit = Math.random() < 0.20;
  bullets.push({x,y,vx,vy,from,dead:false,life:life, dmg:dmg, isCrit:isCrit, type:type, hitList:[]}); 
}

function updateBullets(dt){
  for(let i=bullets.length-1;i>=0;i--){
    const b = bullets[i]; b.x += b.vx*dt; b.y += b.vy*dt; b.life -= dt;
    if(b.life<=0 || b.x<-50 || b.x>WORLD_W+50 || b.y<-20 || b.y>H+20){ bullets.splice(i,1); continue; }
    
    let hitW = 6;
    if (b.type === 'lightning') hitW = 20;
    if (b.type === 'hellfire' || b.type === 'plasma_player') hitW = 16;
    if (b.type === 'sniper_player' || b.type === 'laser') hitW = 30;
    if (b.type === 'doom') hitW = 24;
    const br = {x:b.x - (hitW/2), y:b.y-3, w:hitW, h:6};
    
    let hit = false;
    for(const p of props){ if(!p.dead && aabb(br, p)){ damageProp(p, shopStats.dmg.val); hit=true; break; } }
    if(hit) {
        if(b.type === 'plasma_player') {
            explodeDynamite(b.x, b.y, 'player_plasma', Math.floor(shopStats.dmg.val * 2.0));
            bullets.splice(i,1); continue;
        } else if(b.type === 'doom') {
            explodeDynamite(b.x, b.y, 'player_doom', Math.floor(shopStats.dmg.val * 3.0));
            bullets.splice(i,1); continue;
        } else if(b.type !== 'lightning' && b.type !== 'hellfire' && b.type !== 'sniper_player' && b.type !== 'laser'){ 
            bullets.splice(i,1); continue; 
        }
    }

    if(b.from==='player'){
      let hitEnemy = false;
      for(const en of enemies){
        if(!en.alive) continue;
        if(aabb(br, enemyRect(en))){ 
          if(b.type === 'lightning' || b.type === 'hellfire' || b.type === 'sniper_player' || b.type === 'plasma_player' || b.type === 'laser' || b.type === 'doom') {
             if(!b.hitList.includes(en)){
                b.hitList.push(en);
                
                let finalDmg = shopStats.dmg.val;
                if (b.type === 'hellfire') finalDmg = Math.floor(shopStats.dmg.val * 1.5);
                else if (b.type === 'lightning') finalDmg = Math.floor(shopStats.dmg.val * 0.85);
                else if (b.type === 'sniper_player') finalDmg = Math.floor(shopStats.dmg.val * 3.5);
                else if (b.type === 'plasma_player') finalDmg = Math.floor(shopStats.dmg.val * 1.5); 
                else if (b.type === 'laser') finalDmg = Math.floor(shopStats.dmg.val * 5.0); 
                else if (b.type === 'doom') finalDmg = Math.floor(shopStats.dmg.val * 2.0); 
                
                let c = b.isCrit;
                if (b.type === 'sniper_player' || b.type === 'laser') c = Math.random() < 0.6; 
                if(c) finalDmg = Math.floor(finalDmg * 2); 
                
                damageEnemy(en, finalDmg, b.x, b.y, b.vx, 'player', c);

                if (b.type === 'plasma_player') {
                    explodeDynamite(b.x, b.y, 'player_plasma', Math.floor(shopStats.dmg.val * 2.0));
                    hitEnemy = true;
                } else if (b.type === 'doom') {
                    explodeDynamite(b.x, b.y, 'player_doom', Math.floor(shopStats.dmg.val * 3.0));
                    hitEnemy = true;
                }
             }
             if((b.type === 'plasma_player' || b.type === 'doom') && hitEnemy) break;
          } else {
             let finalDmg = shopStats.dmg.val;
             if(b.isCrit) finalDmg = Math.floor(finalDmg * 2); 
             damageEnemy(en, finalDmg, b.x, b.y, b.vx, 'player', b.isCrit); 
             hitEnemy = true; break; 
          }
        }
      }
      if(hitEnemy && b.type !== 'lightning' && b.type !== 'hellfire' && b.type !== 'sniper_player' && b.type !== 'laser') { bullets.splice(i,1); continue; }
    } else {
      if(player.alive && player.invuln<=0 && !player.isDashing && aabb(br, playerRect())){ 
        damagePlayer(b.dmg || 14, b.type === 'ghost'); bullets.splice(i,1); 
      }
    }
  }
}

function drawBullets(){
  for(const b of bullets){
    const bx = Math.round(b.x); const by = Math.round(b.y); const isPlayer = b.from === 'player';
    if(b.type === 'lightning') {
      ctx.fillStyle = '#00ffff'; ctx.fillRect(bx - 10, by - 2, 20, 4);
      ctx.fillStyle = '#ffffff'; ctx.fillRect(bx - 8, by - 1, 16, 2);
    } else if (b.type === 'hellfire') {
      ctx.fillStyle = '#ff0000'; ctx.beginPath(); ctx.arc(bx, by, 6, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#ffff00'; ctx.beginPath(); ctx.arc(bx, by, 3, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#ffaa00'; ctx.fillRect(bx - (b.vx>0?15:-5), by - 2, 10, 4);
    } else if (b.type === 'sniper_player') {
      ctx.fillStyle = '#0088ff'; ctx.fillRect(bx - 15, by - 2, 30, 4);
      ctx.fillStyle = '#ffffff'; ctx.fillRect(bx - 10, by - 1, 20, 2);
    } else if (b.type === 'plasma_player') {
      ctx.fillStyle = '#00ffaa'; ctx.beginPath(); ctx.arc(bx, by, 8, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(bx, by, 4, 0, Math.PI*2); ctx.fill();
    } else if (b.type === 'laser') {
      ctx.fillStyle = '#ff00ff'; ctx.fillRect(bx - 20, by - 4, 40, 8);
      ctx.fillStyle = '#ffffff'; ctx.fillRect(bx - 15, by - 2, 30, 4);
    } else if (b.type === 'doom') {
      ctx.fillStyle = '#8800ff'; ctx.beginPath(); ctx.arc(bx, by, 12, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#ff00ff'; ctx.beginPath(); ctx.arc(bx, by, 8, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(bx, by, 4, 0, Math.PI*2); ctx.fill();
    } else {
      ctx.fillStyle = '#0a0502'; ctx.fillRect(bx - 5, by - 3, 10, 6);
      ctx.fillStyle = b.isCrit ? '#ffea00' : (isPlayer ? '#ffb347' : '#e62200'); 
      ctx.fillRect(bx - 4, by - 2, 8, 4);
      ctx.fillStyle = '#ffffff'; ctx.fillRect(bx - 2, by - 1, 6, 2);
    }
  }
}

let enemies = []; let waveNum = 0; let waveEnemiesToSpawn = 0; let spawnTimer = 0; let waveBreakTimer = 2.0; let score = 0;
function enemyRect(en){ const w = 7 * en.scale; const h = 38 * en.scale; return {x:en.x-w, y:en.y-h, w:w*2, h:h}; }

function makeEnemy(type){
  const fromLeft = Math.random()<0.5; const spawnDist = camera.x + (fromLeft ? -50 : W + 50); const ex = clamp(spawnDist, 10, WORLD_W-10);
  
  let diffMod = (difficultyMode === 'hell') ? 6.0 : (difficultyMode === 'nightmare' ? 2.5 : (difficultyMode === 'hard' || difficultyMode === 'classic' ? 1.8 : 1.0));
  let beyondMultiplier = (waveNum >= 15 && !isPractice) ? 2.0 : 1.0;
  
  const speedMul = clamp(1 + (waveNum * 0.05), 1.0, 3.0) * (difficultyMode === 'hell' ? 1.5 : 1.0); 
  const hpMul = (1 + (waveNum * 0.25)) * beyondMultiplier; 
  const dmgMul = (1 + (waveNum * 0.15)) * beyondMultiplier; 
  let bossLevel = Math.floor(waveNum / 5);

  if(type === 'boss' || type === 'necromancer' || type === 'inferno' || type === 'void_lord' || type === 'dragon'){ 
    let bHp = 800 * hpMul * diffMod; let bSpeed = 45 * speedMul * diffMod;
    let sc = clamp(2.5 + bossLevel*0.2, 2.5, 4.0);
    
    if (type === 'inferno') { bHp *= 1.2; bSpeed *= 0.8; }
    if (type === 'void_lord') { bHp *= 0.8; bSpeed *= 1.4; }
    if (type === 'dragon') { bHp *= 1.8; bSpeed *= 0.6; sc = clamp(4.0 + bossLevel*0.2, 4.0, 5.0); }

    return { type, x: ex, y: GROUND_Y-1, vx: fromLeft?bSpeed:-bSpeed, vy:0, hp:bHp, maxHp:bHp, alive:true, walkPhase:0, 
             shootCd: 1.5, skillCd: 3.0, dashTime: 0, breathTimer: 0, bossLevel: bossLevel, onGround:true, scale: sc, dmgBase: 25*dmgMul }; 
  } 
  else if(type==='bomber'){
    let spd = clamp(110 * speedMul * diffMod, 110, 400);
    return { type, x: ex, y: GROUND_Y-1, vx: fromLeft?spd:-spd, vy:0, hp:30*hpMul*diffMod, maxHp:30*hpMul*diffMod, alive:true, walkPhase:rand(0,6), onGround:true, scale: 1, dmgBase: 50*dmgMul, fuse: 0 };
  }
  else if(type==='cultist'){
    let spd = 60 * speedMul * diffMod;
    return { type, x: ex, y: GROUND_Y-1, vx: fromLeft?spd:-spd, vy:0, hp:50*hpMul*diffMod, maxHp:50*hpMul*diffMod, alive:true, walkPhase:rand(0,6), skillCd: rand(1, 2), onGround:true, scale: 1, dmgBase: 25*dmgMul };
  }
  else if(type==='ghost'){
    let spd = 70 * speedMul * diffMod; let gy = GROUND_Y - 20;
    return { type, x: ex, y: gy, vx: fromLeft?spd:-spd, vy:0, hp:25*hpMul*diffMod, maxHp:25*hpMul*diffMod, alive:true, walkPhase:0, onGround:true, scale: 1, dmgBase: 20*dmgMul };
  }
  else if(type==='demon'){
    let spd = 150 * speedMul * diffMod;
    return { type, x: ex, y: GROUND_Y-1, vx: fromLeft?spd:-spd, vy:0, hp:60*hpMul*diffMod, maxHp:60*hpMul*diffMod, alive:true, walkPhase:rand(0,6), attackCd:0, shootCd: 1.5, onGround:true, scale: 1.1, dmgBase: 35*dmgMul }; 
  }
  else if(type==='tank'){
    return { type, x: ex, y: GROUND_Y-1, vx: fromLeft?30*speedMul*diffMod:-30*speedMul*diffMod, vy:0, hp:150*hpMul*diffMod, maxHp:150*hpMul*diffMod, alive:true, walkPhase:rand(0,6), attackCd:0, onGround:true, scale: 1.3, dmgBase: 30*dmgMul }; 
  }
  else if(type==='assassin'){
    return { type, x: ex, y: GROUND_Y-1, vx: fromLeft?130*speedMul*diffMod:-130*speedMul*diffMod, vy:0, hp:30*hpMul*diffMod, maxHp:30*hpMul*diffMod, alive:true, walkPhase:rand(0,6), attackCd:0, skillCd: 0, dashTime: 0, onGround:true, scale: 0.9, dmgBase: 20*dmgMul }; 
  }
  else if(type==='sniper'){
    return { type, x: ex, y: GROUND_Y-1, vx: fromLeft?40*speedMul*diffMod:-40*speedMul*diffMod, vy:0, hp:35*hpMul*diffMod, maxHp:35*hpMul*diffMod, alive:true, walkPhase:rand(0,6), shootCd: 2.0, onGround:true, scale: 1, dmgBase: 25*dmgMul };

function startWave(){
  waveNum++;
  
  if(waveNum === 15 && !isPractice) {
      banner = {text:`WARNING: BEYOND WAVE 15! ENEMIES MULTIPLIED!`, timer:4.0}; 
  } else if(waveNum % 5 === 0) {
      banner = {text:`WARNING: LV.${Math.floor(waveNum/5)} BOSS APPROACHING!`, timer:3.5}; 
  }

  if(waveNum % 5 === 0) {
    let bossesToSpawn = 1;
    if ((difficultyMode === 'nightmare' || difficultyMode === 'hell') && waveNum >= 15) bossesToSpawn = 2;
    for(let i=0; i<bossesToSpawn; i++) {
        let bType = 'boss';
        if (difficultyMode === 'hell') {
            bType = 'dragon';
        } else if (difficultyMode === 'nightmare') {
            const nBosses = ['necromancer', 'inferno', 'void_lord'];
            bType = nBosses[Math.floor(Math.random() * nBosses.length)];
        }
        enemies.push(makeEnemy(bType)); 
    }
    addShake(20);
    waveEnemiesToSpawn = difficultyMode === 'hell' ? 8 : (difficultyMode === 'nightmare' ? 6 : 0);
  } else { 
    let baseCount = 3 + waveNum*1.8;
    let diffMult = (difficultyMode === 'hell') ? 3.5 : (difficultyMode === 'nightmare' ? 2.5 : (difficultyMode === 'hard' || difficultyMode === 'classic' ? 1.5 : 1.0));
    waveEnemiesToSpawn = Math.floor(baseCount * diffMult); 
  }
  spawnTimer = 0.2;
}

function damageEnemy(en, dmg, hx, hy, bulletVx, source='player', isCrit = false){
  en.hp -= dmg; playSnd('hit');
  
  if (isCrit) {
    spawnParticles(hx, hy, 18, ['#ffff00','#ffaa00','#ffffff'], Math.abs(bulletVx)*0.4 + 150, 0.5, 4);
    spawnText(en.x, en.y - 45 - (en.scale*10), `CRIT ${dmg}!`, '#ffeb3b', 1.5, 1.0); addShake(5);
  } else {
    spawnParticles(hx, hy, 12, ['#ff0000','#aa0000','#770000'], Math.abs(bulletVx)*0.3 + 100, 0.4, 3);
    spawnText(en.x, en.y - 35 - (en.scale*10), `${dmg}`, '#ffffff', 1.0, 0.7); addShake(2);
  }
  
  if(en.hp<=0 && en.alive && en.type !== 'dummy'){
    en.alive = false; let coins = 0; playSnd('exp');
    if(en.type === 'bomber'){ explodeDynamite(en.x, en.y, 'enemy_bomber', en.dmgBase); }
    
    if(source === 'player' && !isPractice){
      addCombo();
      let comboMultiplier = 1 + (combo * 0.1); let extraGold = Math.floor(combo / 5);   
      const isBoss = (en.type === 'boss' || en.type === 'necromancer' || en.type === 'inferno' || en.type === 'void_lord' || en.type === 'dragon');
      if(isBoss){ 
        score += Math.floor(2000 * comboMultiplier); coins = 25 + extraGold; addShake(25); 
        spawnParticles(en.x, en.y-40, 150, ['#ff0000','#880000','#550000','#ff5555'], 450, 1.2, 6); 
      } else { 
        score += Math.floor((en.type==='grunt' || en.type==='bomber' || en.type==='tank' || en.type==='demon' ? 100 : 150) * comboMultiplier); 
        coins = (en.type==='grunt' || en.type==='bomber' ? 1 : (en.type==='demon'? 3 : 2)) + extraGold; addShake(6); 
        spawnParticles(en.x, en.y-20, 25, ['#ff0000','#aa0000','#550000'], 250, 0.6, 4); 
      }

      if (difficultyMode === 'classic') coins = Math.floor(coins * 1.5);

      spawnCoin(en.x, en.y-20, coins);
      
      let healChance = difficultyMode === 'classic' ? 0.01 : 0.1; 
      if (Math.random() < healChance) items.push({ type:'heal', x:en.x, y:en.y-20, vx:rand(-100,100), vy:rand(-250,-150), w:12, h:12, life:10, onGround:false });
      
      if (difficultyMode === 'nightmare' || difficultyMode === 'hell') {
          let dropChance = difficultyMode === 'hell' ? 0.08 : 0.06;
          if (isBoss || Math.random() < dropChance) {
              items.push({ type:'cursed_gem', x:en.x, y:en.y-20, vx:rand(-150,150), vy:rand(-300,-150), w:12, h:12, life:10, onGround:false });
          }
      }

      if(player.classId === 6 && Math.random() < 0.25){
          player.hp = Math.min(player.maxHp, player.hp + 2);
          spawnText(player.x, player.y - 40, "+2 HP", "#ff0000", 1.0, 1);
      }
    }
  }
}

function damagePlayer(dmg, isGhost = false){
  if(player.invuln>0 || player.isDashing) return;
  
  let actualDmg = Math.floor(dmg * (1 - shopStats.armor.val) * player.dmgTakenMult); 
  
  if (player.classId === 8 && isGhost) actualDmg = Math.floor(actualDmg * 0.5);

  if (player.frenzyTimer > 0) {
      actualDmg = Math.floor(actualDmg * 2.0);
  }

  playSnd('hit');
  player.hp -= actualDmg; player.invuln = 0.6; addShake(10); combo = 0; 
  spawnParticles(player.x, player.y-20, 14, ['#ff3a3a','#a80000','#ffdada'], 260, 0.5, 4);
  spawnText(player.x, player.y-40, `-${actualDmg}`, '#ff3a3a', 1.2, 1);
  if(player.hp<=0){ 
    player.hp = 0; player.alive = false; gameState = 'gameover'; 
    let earned = Math.floor(score / 50) + gold; 
    if (!isPractice) {
        globalCoins += earned; saveGlobal(); earnedCoinsThisRun = earned;
    }
  }
}

function updateEnemies(dt){
  let diffMod = (difficultyMode === 'hell') ? 6.0 : (difficultyMode === 'nightmare' ? 2.5 : (difficultyMode === 'hard' || difficultyMode === 'classic' ? 1.8 : 1.0));
  
  for(let i=enemies.length-1;i>=0;i--){
    const en = enemies[i]; if(!en.alive){ enemies.splice(i,1); continue; }
    en.walkPhase += dt*8; const dx = player.x - en.x; const dist = Math.abs(dx); const dir = dx>0?1:-1;

    if (en.type === 'dummy') {
        en.vx = 0;
        if (en.hp < 500000) en.hp = 999999;
    }
    else if(en.type === 'boss'){
      en.vx = dir * Math.abs(en.vx); en.shootCd -= dt; en.skillCd -= dt;
      if(en.shootCd <= 0 && player.alive){
        const gunY = en.y - (26 * en.scale * 0.7); const baseAng = Math.atan2((player.y-19) - gunY, player.x-en.x);
        let spread = clamp(3 + Math.floor(en.bossLevel / 2) + (difficultyMode==='nightmare'?3:0), 3, 11); 
        let angDiff = 0.15; let bulletSpeed = clamp(280 * diffMod * (1 + waveNum*0.02), 280, 800);
        for(let a=-Math.floor(spread/2); a<=Math.floor(spread/2); a++) { 
          spawnBullet(en.x, gunY, Math.cos(baseAng+a*angDiff)*bulletSpeed, Math.sin(baseAng+a*angDiff)*bulletSpeed, 'enemy', 4.0, en.dmgBase); 
        }
        spawnParticles(en.x+dir*30, gunY, 20, ['#ff0000','#ffcf7a'], 220, 0.4, 4);
        en.shootCd = Math.max(0.4, (difficultyMode === 'normal' ? 1.5 : 1.1) - (en.bossLevel*0.05)); 
        addShake(8); playSnd('shoot');
      }
      if(en.skillCd <= 0 && player.alive){
        let dynaCount = Math.min(6, 1 + Math.floor(en.bossLevel/2));
        for(let j=0; j<dynaCount; j++){
           let tx = dir * rand(200, 600); let ty = rand(-300, -800);
           spawnDynamite(en.x, en.y-40, tx, ty, 'enemy', en.dmgBase * 1.5);
        }
        en.skillCd = Math.max(2.0, 5.0 - (en.bossLevel*0.2)); 
        playSnd('jump'); addShake(5);
      }
    } 
    else if (en.type === 'dragon') {
      en.vx = dir * Math.abs(en.vx); en.shootCd -= dt; en.skillCd -= dt;
      
      spawnParticles(en.x + rand(-40, 40), en.y - rand(0, 150), 2, ['#ff4400', '#ff0000', '#ffff00'], 80, 0.5, 5);

      if (en.breathTimer > 0) {
          en.breathTimer -= dt; en.vx = 0; 
          if (Math.random() < 0.4) {
              const gunY = en.y - (35 * en.scale * 0.7); let spread = rand(-0.4, 0.4);
              spawnBullet(en.x + dir*40, gunY, dir * rand(500, 900), spread * 600, 'enemy', 2.0, en.dmgBase * 0.7);
              spawnParticles(en.x + dir*50, gunY, 5, ['#ff4400', '#ff0000', '#ffff00'], 400, 0.5, 6);
          }
      } else {
          if (en.shootCd <= 0 && player.alive) {
              en.breathTimer = 1.2; 
              en.shootCd = Math.max(2.0, 4.0 - (en.bossLevel*0.2)); playSnd('exp'); addShake(15);
          }
          if (en.skillCd <= 0 && player.alive) {
              for(let j=0; j<6; j++){
                 spawnDynamite(player.x + rand(-250, 250), -100 - rand(0,400), rand(-50,50), rand(300,600), 'enemy_meteor', en.dmgBase * 1.5, 'meteor');
              }
              en.skillCd = Math.max(3.0, 6.0 - (en.bossLevel*0.2)); playSnd('jump'); addShake(10);
          }
      }
    }
    else if (en.type === 'necromancer') {
      en.vx = dir * Math.abs(en.vx); en.shootCd -= dt; en.skillCd -= dt;
      if(en.shootCd <= 0 && player.alive){
        for (let j=-1; j<=1; j++) {
           let tx = player.x + j*60;
           spawnDynamite(tx, -50, rand(-20,20), rand(300,500), 'enemy_meteor', en.dmgBase * 1.2, 'meteor');
        }
        en.shootCd = Math.max(1.5, 3.5 - (en.bossLevel*0.2)); playSnd('shoot'); addShake(8);
      }
      if(en.skillCd <= 0 && player.alive){
        let gCount = Math.min(4, 1 + Math.floor(en.bossLevel/2));
        for(let j=0; j<gCount; j++){
           let gx = en.x + rand(-50,50);
           enemies.push({ type: 'ghost', x: gx, y: GROUND_Y-20, vx: dir*rand(40,80), vy:0, hp:30, maxHp:30, alive:true, walkPhase:0, onGround:true, scale: 1, dmgBase: en.dmgBase });
        }
        en.skillCd = Math.max(3.0, 7.0 - (en.bossLevel*0.3)); playSnd('jump'); addShake(5);
      }
    }
    else if (en.type === 'inferno') {
      en.vx = dir * Math.abs(en.vx); en.shootCd -= dt; en.skillCd -= dt;
      if(en.shootCd <= 0 && player.alive){
        for(let j=0; j<3; j++) {
           let tx = dir * rand(200, 600); let ty = rand(-300, -700);
           spawnDynamite(en.x, en.y-40, tx, ty, 'enemy', en.dmgBase * 1.2);
        }
        en.shootCd = Math.max(1.5, 3.0 - (en.bossLevel*0.2)); playSnd('shoot'); addShake(8);
      }
      if(en.skillCd <= 0 && player.alive){
        let mCount = Math.min(3, 1 + Math.floor(en.bossLevel/2));
        for(let j=0; j<mCount; j++){
           spawnDynamite(player.x + rand(-100, 100), -50, rand(-20,20), rand(300,500), 'enemy_meteor', en.dmgBase * 1.5, 'meteor');
        }
        en.skillCd = Math.max(2.5, 5.0 - (en.bossLevel*0.3)); playSnd('jump'); addShake(10);
      }
    }
    else if (en.type === 'void_lord') {
      en.shootCd -= dt; en.skillCd -= dt; en.dashTime -= dt;
      if (en.dashTime > 0) {
          en.vx = dir * 500;
          if (dist < 40 && player.alive) { damagePlayer(en.dmgBase * 1.5, true); }
      } else {
          en.vx = dir * Math.abs(en.vx);
      }
      if(en.shootCd <= 0 && player.alive){
        const gunY = en.y - (26 * en.scale * 0.7);
        spawnBullet(en.x, gunY, dir * 1200, 0, 'enemy_sniper', 3.0, en.dmgBase * 2.0);
        spawnParticles(en.x+dir*30, gunY, 15, ['#aa00ff','#ffffff'], 300, 0.4, 4);
        en.shootCd = Math.max(1.0, 2.5 - (en.bossLevel*0.15)); playSnd('shoot'); addShake(10);
      }
      if(en.skillCd <= 0 && player.alive){
        en.dashTime = 0.5;
        en.skillCd = Math.max(2.0, 4.0 - (en.bossLevel*0.2)); playSnd('dash'); addShake(5);
      }
    }
    else if(en.type === 'bomber'){
      en.vx = dir * Math.abs(en.vx);
      if (dist < 40) { en.fuse += dt; en.vx = 0; if (en.fuse > 0.4) { explodeDynamite(en.x, en.y, 'enemy_bomber', en.dmgBase); en.hp = 0; en.alive = false; } } else { en.fuse = 0; }
    } 
    else if(en.type === 'cultist'){
      if(dist<200) en.vx = -dir * Math.abs(en.vx); else if(dist>300) en.vx = dir * Math.abs(en.vx); else en.vx = 0;
      en.skillCd -= dt;
      if (en.skillCd <= 0 && player.alive) {
          spawnDynamite(player.x, -50, 0, 400, 'enemy_meteor', en.dmgBase, 'meteor');
          en.skillCd = Math.max(1.5, 3.0 - waveNum*0.05); playSnd('shoot');
          spawnParticles(en.x, en.y-25, 10, ['#a300cc','#ff00ff'], 150, 0.4, 4);
      }
    }
    else if(en.type === 'demon'){
      if(dist < 120) en.vx = -dir * Math.abs(en.vx); 
      else en.vx = dir * Math.abs(en.vx);
      en.shootCd -= dt;
      if(en.shootCd <= 0 && player.alive){
          const gunY = en.y - 20;
          spawnBullet(en.x, gunY, dir * 700, 0, 'enemy', 2.0, en.dmgBase);
          spawnParticles(en.x+dir*15, gunY, 10, ['#ff0000','#000000'], 200, 0.3, 4);
          en.shootCd = Math.max(0.8, 1.5 - waveNum*0.05); playSnd('shoot');
      }
    }
    else if(en.type === 'ghost'){
      en.y = (GROUND_Y - 20) + Math.sin(Date.now()/150)*5;
      if(dist > 10) en.x += dir * Math.abs(en.vx) * dt;
      if (dist < 20 && Math.abs(player.y - en.y) < 40) {
          damagePlayer(en.dmgBase, true); en.hp = 0; en.alive = false; 
          spawnParticles(en.x, en.y, 20, ['#ffffff','#00ffff'], 150, 0.5, 3); playSnd('hit');
      }
      en.vx = 0; 
    }
    else if(en.type==='tank' || en.type==='grunt'){
      if(dist>25) en.vx = dir * Math.abs(en.vx); else en.vx = 0;
      en.attackCd -= dt; if(dist<=30 && en.attackCd<=0 && player.alive){ damagePlayer(en.dmgBase, true); en.attackCd = Math.max(0.5, 1.2 - waveNum*0.02); }
    }
    else if (en.type === 'assassin') {
      en.skillCd -= dt; en.attackCd -= dt;
      if(dist < 180 && en.skillCd <= 0){ en.vx = dir * 400; en.skillCd = 2.5; en.dashTime = 0.3; playSnd('dash'); }
      if (en.dashTime > 0) { 
          en.dashTime -= dt; 
          if(dist < 20 && en.attackCd <= 0){ damagePlayer(en.dmgBase, true); en.attackCd = 1.0; }
      } else {
          if(dist > 20) en.vx = dir * 130 * diffMod; else en.vx = 0;
          if(dist <= 20 && en.attackCd <= 0){ damagePlayer(en.dmgBase, true); en.attackCd = 1.0; }
      }
    }
    else if (en.type === 'sniper') {
      if(dist < 300) en.vx = -dir * Math.abs(en.vx); else if(dist > 400) en.vx = dir * Math.abs(en.vx); else en.vx = 0;
      en.shootCd -= dt;
      if(en.shootCd <= 0 && player.alive){
          const gunY = en.y - 26; let bSpeed = 1000;
          spawnBullet(en.x, gunY, dir * bSpeed, 0, 'enemy_sniper', 2.0, en.dmgBase * 1.5);
          en.shootCd = Math.max(1.5, 3.0 - waveNum*0.05); playSnd('shoot');
          spawnParticles(en.x+dir*15, gunY, 5, ['#ff0000','#ffffff'], 200, 0.2, 3);
      }
    }
    else { 
      if(dist<150) en.vx = -dir * Math.abs(en.vx); else if(dist>250) en.vx = dir * Math.abs(en.vx); else en.vx = 0;
      en.shootCd -= dt;
      if(en.shootCd<=0 && player.alive){
        const gunY = en.y - 26; let bSpeed = clamp(260 * diffMod * (1 + waveNum*0.02), 260, 900);
        spawnBullet(en.x, gunY, Math.cos(Math.atan2((player.y-19)-gunY, dx))*bSpeed, Math.sin(Math.atan2((player.y-19)-gunY, dx))*bSpeed, 'enemy', 2.0, en.dmgBase);
        spawnParticles(en.x+dir*15, gunY, 4, ['#ffcf7a','#ff8a3a'], 120, 0.2, 3);
        en.shootCd = Math.max(0.2, (rand(1.1,1.8) - waveNum*0.05) / diffMod); playSnd('shoot');
      }
    }
    
    if (en.type !== 'ghost' && en.type !== 'dummy') { en.x += en.vx*dt; }
    en.x = clamp(en.x, 10, WORLD_W-10);
  }
}

function drawEnemies(){
  for(const en of enemies){
    let pal = GUNSLINGER_PAL;
    if (en.type === 'dummy') pal = DUMMY_PAL;
    else if (en.type === 'boss') pal = BOSS_PAL;
    else if (en.type === 'necromancer') pal = NECRO_PAL;
    else if (en.type === 'inferno') pal = INFERNO_PAL;
    else if (en.type === 'void_lord') pal = VOID_PAL;
    else if (en.type === 'dragon') pal = DRAGON_PAL;
    else if (en.type === 'demon') pal = DEMON_PAL;
    else if (en.type === 'bomber') pal = BOMBER_PAL;
    else if (en.type === 'grunt') pal = GRUNT_PAL;
    else if (en.type === 'cultist') pal = CULTIST_PAL;
    else if (en.type === 'ghost') pal = GHOST_PAL;
    else if (en.type === 'tank') pal = TANK_PAL;
    else if (en.type === 'assassin') pal = ASSASSIN_PAL;
    else if (en.type === 'sniper') pal = SNIPER_PAL;

    let facing = en.type==='ghost' ? (player.x > en.x ? 1 : -1) : (en.vx>=0?1:-1);
    if(en.vx === 0 && en.type !== 'ghost') facing = player.x > en.x ? 1 : -1;
    if(en.type === 'void_lord' && en.dashTime > 0) facing = en.vx>=0?1:-1;
    if(en.type === 'dummy') facing = -1;
    
    ctx.save();
    if(en.type === 'bomber' && en.fuse > 0) { if(Math.floor(Date.now()/50)%2===0) ctx.globalAlpha = 0.5; }
    if(en.type === 'assassin' && en.dashTime > 0) { ctx.globalAlpha = 0.3; }
    if(en.type === 'void_lord' && en.dashTime > 0) { ctx.globalAlpha = 0.5; }
    
    let drawY = en.y;
    if(en.type === 'ghost') { ctx.globalAlpha = 0.6; }
    
    if (en.type === 'sniper' && en.shootCd < 1.0) {
        ctx.strokeStyle = `rgba(255, 0, 0, ${1 - en.shootCd})`;
        ctx.lineWidth = 1; ctx.beginPath();
        ctx.moveTo(en.x, en.y - 26); ctx.lineTo(en.x + facing * 1000, en.y - 26);
        ctx.stroke();
    }
    
    drawFigure(en.x, drawY, facing===0?1:facing, en.walkPhase, pal, en.type==='gunslinger'||en.type==='sniper', false, en.scale);
    ctx.restore();

    const hpBarY = drawY - (45 * en.scale), hpBarW = 30 * en.scale;
    const isBoss = (en.type === 'boss' || en.type === 'necromancer' || en.type === 'inferno' || en.type === 'void_lord' || en.type === 'dragon');
    ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(en.x-(hpBarW/2)-1, hpBarY-1, hpBarW+2, 5);
    ctx.fillStyle = isBoss ? '#ff0000' : (en.type==='grunt'||en.type==='bomber'||en.type==='tank'||en.type==='dummy' ? '#c94a2a':'#8a2a8a');
    ctx.fillRect(en.x-(hpBarW/2), hpBarY, hpBarW*(en.hp/en.maxHp), 3);
    
    if(isBoss){
      ctx.fillStyle='#fff'; ctx.font='bold 10px monospace'; ctx.fillText(`LV.${en.bossLevel}`, en.x-(hpBarW/2), hpBarY-4);
    }
  }
}

function stepEntityVertical(entity, dt){
  if(entity.climbing || entity.isDashing) return; 
  entity.prevY = entity.y; entity.vy += GRAVITY*dt; entity.y += entity.vy*dt; entity.onGround = false;
  for(const p of platforms){
    if(entity.x > p.x+1 && entity.x < p.x+p.w-1){
      if(entity.vy>=0 && entity.prevY <= p.y+0.5 && entity.y >= p.y){ entity.y = p.y; entity.vy = 0; entity.onGround = true; entity.jumpCount = 0; }
    }
  }
  if(entity.y > GROUND_Y){ entity.y = GROUND_Y; entity.vy=0; entity.onGround=true; entity.jumpCount = 0; }
}

function updatePlayer(dt){
  if(!player.alive) return;
  let speed = player.speed || 250; let moving = false;
  
  if (isPractice && gameState === 'playing' && !player.reloading && !player.isDashing) {
      if (keys['Digit1']) { equippedGun = 0; syncStats(); player.ammo = player.maxAmmo; }
      if (keys['Digit2']) { equippedGun = 1; syncStats(); player.ammo = player.maxAmmo; }
      if (keys['Digit3']) { equippedGun = 2; syncStats(); player.ammo = player.maxAmmo; }
      if (keys['Digit4']) { equippedGun = 3; syncStats(); player.ammo = player.maxAmmo; }
      if (keys['Digit5']) { equippedGun = 4; syncStats(); player.ammo = player.maxAmmo; }
      if (keys['Digit6']) { equippedGun = 5; syncStats(); player.ammo = player.maxAmmo; }
      if (keys['Digit7']) { equippedGun = 12; syncStats(); player.ammo = player.maxAmmo; }
      if (keys['Digit8']) { equippedGun = 13; syncStats(); player.ammo = player.maxAmmo; }
      if (keys['Escape'] && !escPressedLast) { isPractice = false; gameState = 'title'; }
  }

  player.shootCd -= dt; player.invuln -= dt; player.dynaCd -= dt; player.dashCd -= dt;
  
  if(player.frenzyTimer > 0) {
      player.frenzyTimer -= dt;
      player.shootCd -= dt * 1.5; 
      player.ammo = player.maxAmmo; 
      speed *= 0.8; 
  }
  
  if(difficultyMode === 'hell' || isPractice){
      player.ammo = player.maxAmmo;
  }
  
  if (player.isDashing) {
      player.dashTime -= dt; player.vy = 0; player.vx = player.facing * 900; 
      spawnParticles(player.x, player.y - 15, 2, ['#ffffff', '#00ffff'], 30, 0.2, 3); 
      if (player.dashTime <= 0) { player.isDashing = false; }
  } else {
      let touchingRope = null;
      for(const r of ropes){
        if(Math.abs(player.x - r.x) < 14 && player.y > r.y - 5 && player.y - player.h < r.y + r.h){ touchingRope = r; break; }
      }
      if(touchingRope){ if((keys[actionKeys.jump] || keys[actionKeys.down]) && !player.climbing){ player.climbing = true; player.vx = 0; player.vy = 0; player.x = touchingRope.x; } } else { player.climbing = false; }

      const maxJ = (unlockedItems[7] || player.classId === 1 || player.classId === 4) ? 2 : 1; 

      if(player.climbing){
        player.vy = 0; player.vx = 0; player.jumpCount = 0;
        if(keys[actionKeys.jump]){ player.y -= speed*0.7*dt; player.walkPhase += dt*15; moving=true; }
        if(keys[actionKeys.down]){ player.y += speed*0.7*dt; player.walkPhase += dt*15; moving=true; }
        if(keys[actionKeys.left] || keys[actionKeys.right]){ player.climbing = false; }
        if(player.y > touchingRope.y+touchingRope.h){ player.y = touchingRope.y+touchingRope.h; player.climbing=false; }
        if(player.y < touchingRope.y){ player.y = touchingRope.y; } 
      } else {
        if(keys[actionKeys.left]){ player.vx = -speed; player.facing=-1; moving=true; }
        else if(keys[actionKeys.right]){ player.vx = speed; player.facing=1; moving=true; }
        else player.vx = 0;

        if(keys[actionKeys.jump] && !jumpPressedLast){
          if(player.jumpCount < maxJ){ player.vy = -600; player.jumpCount++; player.onGround = false; spawnParticles(player.x, player.y-1, 6, ['#d8c8a0','#b09468'],90,0.35,3); playSnd('jump'); }
        }
        if(keys[actionKeys.dash] && player.dashCd <= 0){
            player.isDashing = true; player.dashTime = 0.15; player.dashCd = 1.2; playSnd('dash'); addShake(3);
        }
      }
  }

  player.x += player.vx*dt; player.x = clamp(player.x, 7, WORLD_W-7); stepEntityVertical(player, dt);

  if(!player.isDashing){
      if(moving && player.onGround && !player.climbing) player.walkPhase += dt*12; else if(!player.onGround && !player.climbing) player.walkPhase = 0;
  }
  if(player.reloading){ player.reloadTimer -= dt; if(player.reloadTimer<=0){ player.reloading=false; player.ammo = player.maxAmmo; } }
  if(keys[actionKeys.reload] && !player.reloading && player.ammo<player.maxAmmo && difficultyMode !== 'hell' && !isPractice){ player.reloading = true; player.reloadTimer = player.reloadTime; }

  const gunX = player.x + player.facing*16; const gunY = player.y - 26;
  if(keys[actionKeys.shoot] && player.shootCd<=0 && !player.reloading && !player.climbing && !player.isDashing){
    if(player.ammo>0 || difficultyMode === 'hell' || isPractice){
      if(difficultyMode !== 'hell' && !isPractice) player.ammo--; 
      player.shootCd = player.shootCdMax;
      
      let gunId = equippedGun; let bSpeed = 800; 
      let bType = player.classId === 3 ? 'lightning' : 'normal';
      let bSpeedMod = player.classId === 3 ? 1.5 : 1.0;
      
      let pColors = player.classId === 3 ? ['#00ffff','#00aaff','#ffffff'] : ['#ffe27a','#ffb347','#fff2c2'];
      if(gunId === 4) pColors = ['#0088ff', '#00ffff', '#ffffff'];
      if(gunId === 12) pColors = ['#ff00ff', '#ffffff'];
      if(gunId === 13) pColors = ['#8800ff', '#ff00ff'];
      
      if(difficultyMode === 'hell'){
          bType = 'hellfire';
          player.shootCd = 0.15;
          spawnBullet(gunX, gunY + rand(-3,3), player.facing*1100, rand(-30,30), 'player', 2.0, 0, bType);
          spawnParticles(gunX+player.facing*5, gunY, 12, ['#ff0000','#ffaa00','#ffff00'], 350, 0.25, 4); 
          addShake(4); playSnd('shoot');
      } else {
          if (gunId === 0) { spawnBullet(gunX, gunY, player.facing*bSpeed*bSpeedMod, 0, 'player', 1.5, 0, bType); } 
          else if (gunId === 1) { 
              spawnBullet(gunX, gunY - 4, player.facing*bSpeed*bSpeedMod, 0, 'player', 1.5, 0, bType); 
              spawnBullet(gunX, gunY + 4, player.facing*bSpeed*bSpeedMod, 0, 'player', 1.5, 0, bType); 
          } 
          else if (gunId === 2) { 
              spawnBullet(gunX, gunY, player.facing*bSpeed*bSpeedMod, 0, 'player', 1.2, 0, bType); 
              spawnBullet(gunX, gunY, player.facing*bSpeed*0.95*bSpeedMod, -40, 'player', 1.2, 0, bType); 
              spawnBullet(gunX, gunY, player.facing*bSpeed*0.95*bSpeedMod, 40, 'player', 1.2, 0, bType); 
              spawnBullet(gunX, gunY, player.facing*bSpeed*0.9*bSpeedMod, -80, 'player', 1.2, 0, bType); 
              spawnBullet(gunX, gunY, player.facing*bSpeed*0.9*bSpeedMod, 80, 'player', 1.2, 0, bType); 
          } 
          else if (gunId === 3) { 
              spawnBullet(gunX, gunY + rand(-3,3), player.facing*bSpeed*bSpeedMod, rand(-40,40), 'player', 1.5, 0, bType); 
          }
          else if (gunId === 4) {
              let sType = bType === 'lightning' ? 'lightning' : 'sniper_player';
              spawnBullet(gunX, gunY, player.facing*bSpeed*2.5*bSpeedMod, 0, 'player', 1.5, 0, sType); 
          }
          else if (gunId === 5) {
              let pType = bType === 'lightning' ? 'lightning' : 'plasma_player';
              spawnBullet(gunX, gunY, player.facing*bSpeed*1.2*bSpeedMod, 0, 'player', 1.5, 0, pType); 
          }
          else if (gunId === 12) {
              spawnBullet(gunX, gunY, player.facing*bSpeed*3.0*bSpeedMod, 0, 'player', 1.5, 0, 'laser'); 
          }
          else if (gunId === 13) {
              spawnBullet(gunX, gunY, player.facing*bSpeed*1.0*bSpeedMod, -60, 'player', 1.5, 0, 'doom'); 
              spawnBullet(gunX, gunY, player.facing*bSpeed*1.2*bSpeedMod, 0, 'player', 1.5, 0, 'doom'); 
              spawnBullet(gunX, gunY, player.facing*bSpeed*1.0*bSpeedMod, 60, 'player', 1.5, 0, 'doom'); 
          }

          if (gunId === 0 || gunId === 1 || gunId === 2 || gunId === 3) {
              spawnParticles(gunX+player.facing*2, gunY, 7, pColors, 200, 0.18, 3); addShake(gunId === 2 ? 6 : 2); playSnd('shoot');
          } else if (gunId === 4) {
              spawnParticles(gunX+player.facing*2, gunY, 15, pColors, 400, 0.3, 4); addShake(10); playSnd('shoot');
          } else if (gunId === 5) {
              spawnParticles(gunX+player.facing*2, gunY, 12, ['#00ffaa','#ffffff'], 250, 0.25, 4); addShake(5); playSnd('exp');
          } else if (gunId === 12) {
              spawnParticles(gunX+player.facing*2, gunY, 20, pColors, 500, 0.4, 5); addShake(8); playSnd('shoot');
          } else if (gunId === 13) {
              spawnParticles(gunX+player.facing*2, gunY, 30, pColors, 300, 0.5, 6); addShake(12); playSnd('exp');
          }
      }
      
      if(player.ammo<=0 && difficultyMode !== 'hell' && !isPractice){ player.reloading = true; player.reloadTimer = player.reloadTime; }
    } else if(!player.reloading){ player.reloading = true; player.reloadTimer = player.reloadTime; }
  }
  
  if((unlockedItems[6] || isPractice) && keys[actionKeys.item] && player.dynaCd <= 0 && !player.isDashing){
    spawnDynamite(player.x, player.y - 20, player.facing * 400, -300, 'player');
    player.dynaCd = 5.0; playSnd('jump');
  }
  const bDown = !!keys[actionKeys.shop]; if(bDown && !bPressedLast && player.onGround && !player.climbing){ gameState = 'shop'; } bPressedLast = bDown;
}

function drawPlayer(){
  if(!player.alive) return;
  if(player.invuln>0 && Math.floor(player.invuln*20)%2===0) return;
  if (player.isDashing) { ctx.globalAlpha = 0.6; }
  
  const aiming = keys[actionKeys.shoot] && player.shootCd > player.shootCdMax*0.6 && !player.reloading && !player.isDashing;
  drawFigure(player.x, player.y, player.facing, player.walkPhase, SKINS_PAL[equippedSkin], aiming, (!player.onGround && !player.climbing) || player.isDashing, 1, player.climbing);
  ctx.globalAlpha = 1.0;
}

function updateSpawning(dt){
  if(comboTimer > 0) { comboTimer -= dt; if(comboTimer <= 0) combo = 0; }
  
  if (isPractice) return;

  if (difficultyMode === 'nightmare' || difficultyMode === 'hell') {
      nightmareTimer -= dt;
      if (nightmareTimer <= 0) {
          startWave(); 
          nightmareTimer = difficultyMode === 'hell' ? 25.0 : 30.0;
      }
  }

  if(enemies.length===0 && waveEnemiesToSpawn===0){ 
      waveBreakTimer -= dt; 
      if(waveBreakTimer<=0){ 
          startWave(); 
          waveBreakTimer = difficultyMode === 'hell' ? 1.5 : 3.0; 
          if(difficultyMode === 'nightmare' || difficultyMode === 'hell') {
              nightmareTimer = difficultyMode === 'hell' ? 25.0 : 30.0;
          }
      } 
      return; 
  }
  
  if(waveEnemiesToSpawn>0){ 
    spawnTimer -= dt; 
    if(spawnTimer<=0){ 
      let r = Math.random();
      let eType = 'grunt';
      
      if (difficultyMode === 'hell') {
         if (r < 0.2) eType = 'bomber';
         else if (r < 0.4) eType = 'demon'; 
         else if (r < 0.55) eType = 'assassin';
         else if (r < 0.7) eType = 'sniper';
         else if (r < 0.85) eType = 'tank';
         else eType = 'ghost';
      }
      else if (difficultyMode === 'nightmare') {
         if (r < 0.15) eType = 'bomber';
         else if (r < 0.3) eType = 'cultist';
         else if (r < 0.45) eType = 'ghost';
         else if (r < 0.6) eType = 'gunslinger';
         else if (r < 0.7) eType = 'assassin';
         else if (r < 0.8) eType = 'sniper';
         else if (r < 0.95) eType = 'tank';
      } else {
         let bomberChance = (difficultyMode === 'hard' || difficultyMode === 'classic') ? 0.2 : 0.1;
         if (r < bomberChance) eType = 'bomber';
         else if (r < 0.35) eType = 'gunslinger';
         else if (r < 0.55 && waveNum > 1) eType = 'sniper'; 
         else if (r < 0.70 && waveNum > 2) eType = 'assassin';
         else if (r < 0.85 && waveNum > 3) eType = 'tank';
      }
      
      enemies.push(makeEnemy(eType)); waveEnemiesToSpawn--; 
      let spawnDelay = rand(0.6, 1.2);
      if (difficultyMode === 'hard') spawnDelay /= 1.5;
      if (difficultyMode === 'classic') spawnDelay /= 2.0; 
      if (difficultyMode === 'nightmare') spawnDelay /= 2.5;
      if (difficultyMode === 'hell') spawnDelay /= 3.5;
      spawnTimer = spawnDelay;
    } 
  }
}

  if(keys['KeyE'] && !ePressedLast) { currentLobbyTab = (currentLobbyTab + 1) % LOBBY_TABS.length; playSnd('hit'); }

  if(keys['KeyA'] && !keyLeftLast) c = Math.max(0, c-1);
  if(keys['KeyD'] && !keyRightLast) c = Math.min(list.length-1, c+1);
  if(keys['KeyW'] && !keyUpLast) c = Math.max(0, c-4); 
  if(keys['KeyS'] && !keyDownLast) c = Math.min(list.length-1, c+4);

  lobbyCursors[currentLobbyTab] = c;

  if(keys['Space'] && !spacePressedLast) {
      let it = list[c];
      if(it.type === 'upgrade') {
          let lvl = globalUpgrades[it.stat];
          if(lvl < it.maxLvl) {
              let cost = Math.floor(it.costBase * Math.pow(1.5, lvl));
              if(globalCoins >= cost) {
                  globalCoins -= cost;
                  globalUpgrades[it.stat]++;
                  saveGlobal(); playSnd('coin');
              } else playSnd('hit');
          } else playSnd('hit');
      } else {
          if(unlockedItems[it.id]){ 
              if(it.type==='gun') equippedGun = it.id; 
              if(it.type==='skin') equippedSkin = it.skinIdx; 
              saveGlobal(); playSnd('coin');
          } else { 
              if(globalCoins >= it.cost){ 
                  globalCoins -= it.cost; 
                  unlockedItems[it.id] = true; 
                  if(it.type==='gun') equippedGun = it.id; 
                  if(it.type==='skin') equippedSkin = it.skinIdx; 
                  saveGlobal(); playSnd('coin'); 
              } else { playSnd('hit'); } 
          }
      }
      spacePressedLast = true;
  }
  if(keys['KeyB'] && !bPressedLast){ gameState = 'title'; bPressedLast = true; }
}

function handleShopInput(){
  const bDown = !!keys[actionKeys.shop]; if(bDown && !bPressedLast){ gameState = 'playing'; } bPressedLast = bDown;
  function tryBuy(stat){
    let cost = stat.costs ? stat.costs[stat.level] : stat.cost;
    if(stat.level < stat.max && gold >= cost){
      gold -= cost; stat.level++; if (stat.val !== undefined && stat.inc !== undefined) stat.val += stat.inc; 
      if (!stat.costs) stat.cost = Math.floor(stat.cost * 1.5); 
      if (stat === shopStats.maxHp) { player.hp += stat.inc; applyClassStats(); } 
      if (stat === shopStats.ammo) player.ammo = player.maxAmmo; 
      syncStats(); playSnd('coin');
    }
  }
  
  if(keys['Digit1']) { if (difficultyMode !== 'hell') tryBuy(shopStats.gunTier); keys['Digit1'] = false; } 
  if(keys['Digit2']) { tryBuy(shopStats.dmg); keys['Digit2'] = false; }
  if(keys['Digit3']) { tryBuy(shopStats.ammo); keys['Digit3'] = false; } if(keys['Digit4']) { tryBuy(shopStats.reload); keys['Digit4'] = false; }
  if(keys['Digit5']) { tryBuy(shopStats.maxHp); keys['Digit5'] = false; } if(keys['Digit6']) { tryBuy(shopStats.armor); keys['Digit6'] = false; }
  if(keys['Digit7']) { tryBuy(shopStats.speed); keys['Digit7'] = false; }
  if(keys['Digit8']) { 
    if(player.hp < player.maxHp && gold >= shopStats.heal.cost){ 
        gold -= shopStats.heal.cost; player.hp = Math.min(player.maxHp, player.hp + 50); playSnd('coin'); 
        if (difficultyMode === 'nightmare' || difficultyMode === 'hell') shopStats.heal.cost += 15;
    } 
    keys['Digit8'] = false; 
  }
}

function drawHUD(){
  ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(16,16,220,26); ctx.fillStyle='#3a1a1a'; ctx.fillRect(22,21,208,16);
  const hpRatio = clamp(player.hp/player.maxHp,0,1); const hpGrad = ctx.createLinearGradient(22,0,230,0);
  hpGrad.addColorStop(0,'#ff4a2a'); hpGrad.addColorStop(1,'#ffb347');
  ctx.fillStyle = hpGrad; ctx.fillRect(22,21,208*hpRatio,16); ctx.strokeStyle='#000'; ctx.lineWidth=2; ctx.strokeRect(22,21,208,16);
  ctx.fillStyle='#fff'; ctx.font='bold 12px monospace'; ctx.fillText('HP', 16, 12);

  ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(16,48,220,30);
  
  if (difficultyMode === 'hell') {
      ctx.fillStyle='#ff0000'; ctx.fillRect(24,56,196,14);
      ctx.fillStyle='#ffff00'; ctx.font='bold 11px monospace'; ctx.fillText('HELLFIRE (INFINITE)', 28, 67);
  } else {
      for(let i=0;i<player.maxAmmo;i++){
        const bx = 24 + i* (200/Math.max(10, player.maxAmmo)); ctx.fillStyle = i<player.ammo ? '#ffd24a' : '#3a3020'; ctx.fillRect(bx, 56, 4, 14); ctx.fillStyle = i<player.ammo ? '#b8860b' : '#20180f'; ctx.fillRect(bx, 56, 4, 4);
      }
      if(player.reloading && !isPractice){ const rProg = 1 - (player.reloadTimer/player.reloadTime); ctx.fillStyle='#1a1a1a'; ctx.fillRect(24,72,196,6); ctx.fillStyle='#6ad1ff'; ctx.fillRect(24,72,196*rProg,6); ctx.fillStyle='#fff'; ctx.font='10px monospace'; ctx.fillText('RELOADING...', 24, 68); }
  }

  ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(16, 84, 220, 26); ctx.fillStyle='#fff'; ctx.font='bold 12px monospace';
  if(unlockedItems[6] || isPractice){ if(player.dynaCd <= 0) { ctx.fillStyle='#00ff00'; ctx.fillText('[Q] DYNAMITE', 24, 102); } else { ctx.fillStyle='#aaa'; ctx.fillText(`[Q] CD: ${player.dynaCd.toFixed(1)}s`, 24, 102); } } else { ctx.fillStyle='#555'; ctx.fillText('[Q] LOCKED', 24, 102); }
  if(player.dashCd <= 0) { ctx.fillStyle='#00ffff'; ctx.fillText('[SHIFT] DASH', 130, 102); } else { ctx.fillStyle='#aaa'; ctx.fillText(`[SHIFT] CD: ${player.dashCd.toFixed(1)}s`, 130, 102); }

  if(combo > 1 && !isPractice){
     ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(16, 116, 130, 36); ctx.fillStyle='#ffb347'; ctx.font='bold 22px monospace'; ctx.fillText(`x${combo} COMBO!`, 24, 142); ctx.fillStyle='#ff3a3a'; ctx.fillRect(16, 152, 130*(comboTimer/3.5), 4);
  }
  
  if (player.frenzyTimer > 0) {
      ctx.fillStyle = 'rgba(85, 0, 170, 0.7)'; ctx.fillRect(16, 160, 220, 16);
      ctx.fillStyle = '#ff00ff'; ctx.fillRect(16, 160, 220 * (player.frenzyTimer / 5.0), 16);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 11px monospace';
      ctx.fillText('CURSED FRENZY (DMGx2, SPD-20%)', 20, 172);
  }

  ctx.textAlign='right'; ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(W-270,16,254,50); ctx.fillStyle='#ffe9c2'; ctx.font='bold 16px monospace'; ctx.fillText('SCORE  '+score, W-24, 36);
  
  let stName = (isPractice) ? PRACTICE_STAGE.name : (difficultyMode==='hell'?HELL_STAGE.name:(difficultyMode==='nightmare'?GRAVEYARD_STAGE.name:STAGES[currentStageIndex].name));
  ctx.fillStyle = (waveNum >= 15 && !isPractice) ? '#ff00ff' : ((waveNum % 5 === 0 && !isPractice) ? '#ff3a3a' : (difficultyMode==='hell' ? '#ff0000' : (difficultyMode==='nightmare' ? '#c300ff' : '#ffb347'))); 
  ctx.font='bold 13px monospace'; 
  ctx.fillText('['+ (isPractice?'PRACTICE':difficultyMode.toUpperCase()) +'] ' + (isPractice?'':('WAVE '+waveNum+ ((waveNum % 5 === 0) ? ' BOSS' : '') +' · '))+stName, W-24, 56);
  
  ctx.textAlign='center'; ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(W/2-100, 16, 200, 30); ctx.fillStyle='#ffd700'; ctx.font='bold 18px monospace'; ctx.fillText('GOLD: '+gold, W/2, 38); 
  
  if (isPractice) {
      ctx.fillStyle = '#00ff00'; ctx.font='bold 14px monospace'; 
      ctx.fillText(`PRACTICE: [1~8] 무기변경 / [ESC] 타이틀`, W/2, 65);
  } else if (difficultyMode === 'nightmare' || difficultyMode === 'hell') {
      ctx.fillStyle = difficultyMode === 'hell' ? '#ff0000' : '#c300ff'; ctx.font='bold 16px monospace'; 
      ctx.fillText(`NEXT WAVE: ${Math.ceil(nightmareTimer)}s`, W/2, 65);
  }
  
  ctx.textAlign='left';
}

function drawBanner(){
  if(banner.timer<=0) return; ctx.save(); ctx.globalAlpha = banner.timer > 0.4 ? 1 : banner.timer/0.4; ctx.textAlign='center';
  ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(W/2-300, 75, 600, 56); ctx.fillStyle = (banner.text.includes('WARNING')) ? '#ff3a3a' : '#ffcf6a';
  ctx.font='bold 28px monospace'; ctx.fillText(banner.text, W/2, 112); ctx.restore();
}

function drawTitle(){
  ctx.fillStyle='#110905'; ctx.fillRect(0,0,W,H); ctx.textAlign='center'; ctx.fillStyle='#ffcf6a'; ctx.font='bold 64px monospace'; ctx.fillText('PIXEL FORCE', W/2+4, H/2-56); ctx.fillStyle='#ff6a2a'; ctx.fillText('PIXEL FORCE', W/2, H/2-60);
  ctx.fillStyle='#fff2c2'; ctx.font='bold 20px monospace'; ctx.fillText('Wild West Run & Gun (Endless & Classes)', W/2, H/2-10);
  ctx.font='16px monospace'; ctx.fillStyle='#ffe27a'; if(Math.floor(Date.now()/500)%2===0) ctx.fillText('PRESS SPACE TO START', W/2, H/2+30);
  ctx.fillStyle='#a8862a'; ctx.fillText('PRESS [S] SETTINGS / [L] LOBBY / [O] BESTIARY / [P] PRACTICE', W/2, H/2+65); ctx.fillStyle='#ffd700'; ctx.fillText(`GLOBAL COINS: ${globalCoins}`, W/2, H/2+100); ctx.textAlign='left';
}

function drawGameOver(){
  ctx.fillStyle='rgba(20,5,5,0.85)'; ctx.fillRect(0,0,W,H); ctx.textAlign='center'; ctx.fillStyle='#ff3a2a'; ctx.font='bold 56px monospace'; ctx.fillText('GAME OVER', W/2, H/2-40);
  ctx.fillStyle='#ffe9c2'; ctx.font='bold 22px monospace'; ctx.fillText('SCORE: '+score+'   WAVE: '+waveNum, W/2, H/2+10);
  ctx.fillStyle='#ffd700'; ctx.font='bold 20px monospace'; ctx.fillText(`EARNED COINS: +${earnedCoinsThisRun}`, W/2, H/2+45);
  ctx.font='16px monospace'; ctx.fillStyle='#ffcf6a'; if(Math.floor(Date.now()/500)%2===0) ctx.fillText('PRESS SPACE TO RESTART', W/2, H/2+85); ctx.textAlign='left';
}

let lastTime = performance.now();
function loop(now){
  const dt = Math.min((now-lastTime)/1000, 1/30); lastTime = now;
  const spaceDown = !!keys['Space']; const spaceJustPressed = spaceDown && !spacePressedLast;
  
  if(gameState==='title' || gameState==='gameover'){
    if(spaceJustPressed) { isPractice=false; gameState = 'diff_select'; mapCursorX=0; mapCursorY=0; }
    if(keys['KeyS'] && gameState==='title' && !sPressedLast) { gameState = 'settings'; settingsCursor=0; }
    if(keys['KeyL'] && gameState==='title' && !lPressedLast) { gameState = 'lobby_shop'; currentLobbyTab=0; }
    if(keys['KeyO'] && gameState==='title' && !oPressedLast) { gameState = 'bestiary'; bestiaryCursor=0; }
    if(keys['KeyP'] && gameState==='title' && !pPressedLast) {
        isPractice = true;
        difficultyMode = 'normal';
        gameState = 'playing';
        resetPlayer();
        score=0; waveNum=0; waveBreakTimer=9999;
        applyStage(-1);
    }
  } else if(gameState==='settings'){ handleSettingsInput(); 
  } else if(gameState==='lobby_shop'){ handleLobbyShopInput();
  } else if(gameState==='bestiary'){ handleBestiaryInput();
  } else if(gameState === 'diff_select'){
    if(keys['KeyA'] && !keyLeftLast) mapCursorX = Math.max(0, mapCursorX-1); 
    if(keys['KeyD'] && !keyRightLast) mapCursorX = Math.min(mapCursorY===0?2:1, mapCursorX+1);
    if(keys['KeyW'] && !keyUpLast) { mapCursorY = 0; mapCursorX = Math.min(mapCursorX, 2); }
    if(keys['KeyS'] && !keyDownLast) { mapCursorY = 1; mapCursorX = Math.min(mapCursorX, 1); }
    
    if(spaceJustPressed){
      if(mapCursorY === 0) difficultyMode = ['normal','hard','classic'][mapCursorX];
      else difficultyMode = ['nightmare','hell'][mapCursorX];

      if (difficultyMode === 'nightmare' || difficultyMode === 'hell' || difficultyMode === 'classic') {
          gameState = 'playing'; resetPlayer(); score=0; waveNum=0; waveBreakTimer=1.2; applyStage(0); 
      } else {
          gameState = 'map_select'; mapCursorX = 0;
      }
    }
  } else if(gameState === 'map_select'){
    if(keys['KeyA'] && !keyLeftLast) mapCursorX = Math.max(0, mapCursorX-1); 
    if(keys['KeyD'] && !keyRightLast) mapCursorX = Math.min(STAGES.length-1, mapCursorX+1);
    if(spaceJustPressed){ gameState='playing'; resetPlayer(); score=0; waveNum=0; waveBreakTimer=1.2; applyStage(mapCursorX); }
  } else if(gameState==='shop'){ handleShopInput();
  } else if(gameState==='playing'){
    updatePlayer(dt); updateEnemies(dt); updateBullets(dt); updateDynamites(dt); updateItems(dt); updateSpawning(dt); updateFloatingTexts(dt);
    if(banner.timer>0) banner.timer -= dt; camera.x = clamp(player.x - W/2, 0, WORLD_W - W);
  }
  
  if(gameState!=='map_select' && gameState!=='title' && gameState!=='settings' && gameState!=='diff_select' && gameState!=='lobby_shop' && gameState!=='bestiary') updateParticles(dt);
  if(shake>0) shake = Math.max(0, shake - dt*40);
  
  spacePressedLast = spaceDown; keyLeftLast = !!keys['KeyA']; keyRightLast = !!keys['KeyD']; 
  keyUpLast = !!keys['KeyW']; keyDownLast = !!keys['KeyS']; lPressedLast = !!keys['KeyL']; jumpPressedLast = !!keys[actionKeys.jump]; qPressedLast = !!keys['KeyQ'];
  pPressedLast = !!keys['KeyP']; escPressedLast = !!keys['Escape']; ePressedLast = !!keys['KeyE']; oPressedLast = !!keys['KeyO'];

  render(); requestAnimationFrame(loop);
}

function render(){
  ctx.save();
  if(shake>0) ctx.translate(rand(-shake,shake), rand(-shake,shake));
  if(gameState === 'playing' || gameState === 'gameover'){
    ctx.translate(-Math.floor(camera.x), 0); ctx.drawImage(bgCanvas,0,0);
    drawPlatformsAndRopes(); drawProps(); drawItems(); drawDynamites(); drawEnemies(); drawPlayer(); drawBullets(); drawParticles(); drawFloatingTexts();
  }
  ctx.restore();

  if (gameState === 'playing' && player.frenzyTimer > 0) {
      const grad = ctx.createRadialGradient(W/2, H/2, H/4, W/2, H/2, H);
      grad.addColorStop(0, 'rgba(85, 0, 170, 0.0)');
      grad.addColorStop(1, 'rgba(170, 0, 255, 0.25)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);
  }

  if(gameState==='playing') { drawHUD(); drawBanner(); } 
  else if(gameState==='shop') { drawShop(); } 
  else if(gameState==='map_select') { drawMapSelect(); }
  else if(gameState==='diff_select') { drawDiffSelect(); }
  else if(gameState==='lobby_shop') { drawLobbyShop(); } 
  else if(gameState==='bestiary') { drawBestiary(); }
  else if(gameState==='settings') { drawSettings(); } 
  else if(gameState==='title') { drawTitle(); } 
  else if(gameState==='gameover') { drawGameOver(); }
}
requestAnimationFrame(loop);
})();
</script>
</body>
